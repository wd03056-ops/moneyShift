<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>계정 및 데이터 삭제 요청 — 근무일지</title>
  <meta
    name="description"
    content="근무일지 앱 계정 탈퇴 및 개인정보 삭제 요청 안내"
  />
  <style>
    :root {
      --bg: #f7f7f8;
      --card: #ffffff;
      --text: #111111;
      --muted: #5c5c5c;
      --border: #e5e5e5;
      --accent: #191919;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .app-name {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    p {
      margin: 0 0 24px;
      color: var(--text);
      font-size: 0.98rem;
      word-break: keep-all;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
    }
    .btn:hover { opacity: 0.92; }
    .note {
      margin-top: 20px;
      margin-bottom: 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .email {
      font-weight: 700;
      color: var(--text);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main>
    <article class="card">
      <h1>계정 및 데이터 삭제 요청</h1>
      <p class="app-name">앱명: 근무일지</p>
      <p>
        근무일지 앱 계정 탈퇴 및 저장된 개인정보(출퇴근 기록, 매장 데이터 등)의
        완전한 삭제를 원하실 경우, 가입된 계정 정보와 함께
        <a class="email" href="mailto:baekson777@gmail.com">baekson777@gmail.com</a>으로
        문의해 주시면 즉시 처리해 드립니다.
      </p>
      <a
        class="btn"
        href="mailto:baekson777@gmail.com?subject=%5B%EA%B7%BC%EB%AC%B4%EC%9D%BC%EC%A7%80%5D%20%EA%B3%84%EC%A0%95%20%EB%B0%8F%20%EB%8D%B0%EC%9D%B4%ED%84%B0%20%EC%82%AD%EC%A0%9C%20%EC%9A%94%EC%B2%AD&body=%EA%B0%80%EC%9E%85%20%EA%B3%84%EC%A0%95%20%EC%A0%95%EB%B3%B4(%EC%9D%B4%EB%A9%94%EC%9D%BC%20%EB%98%90%EB%8A%94%20%EC%97%B0%EB%8F%99%20%EA%B3%84%EC%A0%95)%EC%99%80%20%ED%95%A8%EA%BB%98%20%EC%82%AD%EC%A0%9C%EB%A5%BC%20%EC%9A%94%EC%B2%AD%ED%95%A9%EB%8B%88%EB%8B%A4."
      >
        이메일로 삭제 요청하기
      </a>
      <p class="note">
        앱 안에서도 내정보 → 계정 삭제로 바로 탈퇴할 수 있습니다.
      </p>
    </article>
  </main>
</body>
</html>
